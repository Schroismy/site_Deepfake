<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FAKENEWS - Página Inicial">
    
    <title>FAKENEWS - Início</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
    <style>
        /* ============================================
           SEÇÃO HERO - PÁGINA INÍCIO
           ============================================ */
        .container_hero {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            margin-top: 70px;
        }

        .container_hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('{{ url_for("static", filename="deepfake_fakenes.jpg") }}');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            z-index: -2;
        }

        .container_hero::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(10, 10, 10, 0.3) 0%, rgba(10, 10, 10, 0.7) 100%);
            z-index: -1;
        }

        .hero_content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 40px 20px;
            max-width: 900px;
            animation: fadeInUp 1s ease-out;
            background: rgba(10, 10, 10, 0.4);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            box-shadow: 0 0 50px rgba(0, 102, 255, 0.3),
                        inset 0 0 50px rgba(0, 212, 255, 0.1);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero_title {
            font-size: clamp(40px, 12vw, 80px);
            font-weight: 900;
            margin-bottom: 15px;
            background: linear-gradient(135deg, var(--cor-principal), var(--cor-secundaria));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
        }

        .hero_subtitle {
            font-size: clamp(20px, 6vw, 40px);
            font-weight: 700;
            color: var(--cor-secundaria);
            margin-bottom: 15px;
        }

        .hero_description {
            font-size: 18px;
            color: var(--cor-texto-secundaria);
            margin-bottom: 40px;
        }

        .buttons_container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 40px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-decoration: none;
            display: inline-block;
        }

        .btn_primary {
            background: linear-gradient(135deg, var(--cor-principal), var(--cor-secundaria));
            color: white;
            box-shadow: 0 10px 30px rgba(0, 102, 255, 0.4);
        }

        .btn_primary:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 45px rgba(0, 102, 255, 0.6);
        }

        .btn_secondary {
            background: transparent;
            color: var(--cor-secundaria);
            border: 2px solid var(--cor-secundaria);
        }

        .btn_secondary:hover {
            background: rgba(0, 212, 255, 0.1);
            transform: translateY(-4px);
        }

        .scroll_indicator {
            position: absolute;
            bottom: 30px;
            animation: bounce 2s infinite;
            font-size: 24px;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Responsivo */
        @media (max-width: 768px) {
            .container_hero {
                margin-top: 60px;
            }

            .hero_content {
                padding: 30px 15px;
            }

            .buttons_container {
                flex-direction: column;
                gap: 15px;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <!-- HEADER -->
    <header>
        <nav>
            <div class="logo_nav">FAKENEWS</div>
            <ul class="menu_links">
                <li><a href="{{ url_for('index') }}">Início</a></li>
                <li><a href="{{ url_for('funciona') }}">Como Funciona</a></li>
                <li><a href="{{ url_for('verificar') }}">Verificar</a></li>
                <li><a href="{{ url_for('sobre') }}">Sobre</a></li>
            </ul>
            <div class="menu_toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <!-- HERO SECTION -->
    <section class="container_hero" id="inicio">
        <div class="hero_content">
            <h1 class="hero_title">FAKENEWS</h1>
            <p class="hero_subtitle">Verdade ou Farsa?</p>
            <p class="hero_description">Descubra se uma imagem é um deepfake ou um fato real</p>

            <div class="buttons_container">
                <a href="{{ url_for('verificar') }}" class="btn btn_primary">
                    🚀 Verificar Agora
                </a>
                <a href="{{ url_for('funciona') }}" class="btn btn_secondary">
                    ℹ️ Saiba Mais
                </a>
            </div>
        </div>

        <div class="scroll_indicator">👇</div>
    </section>

    <script src="{{ url_for('static', filename='js/menu.js') }}"></script>
</body>

</html>
